<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="MemoCampus, plataforma educativa de IE La Armonía (prototipo).">
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Materias — MemoCampus</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css"> 
  <style>
    .materia-header-bar {
      height: 6px; border-radius: 6px 6px 0 0;
    }
    .materia-big-card {
      background: var(--bg-card); border: 1px solid var(--borde);
      border-radius: var(--radio-lg); overflow: hidden;
      transition: var(--trans);
    }
    .materia-big-card:hover { box-shadow: var(--sombra-md); }
    .materia-card-body { padding: 1.25rem 1.4rem; }
    .materia-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .materia-emoji { font-size: 1.8rem; }
    .materia-info h4 { font-size: 15px; font-weight: 700; color: var(--txt-primario); margin-bottom: 2px; }
    .materia-info span { font-size: 12px; color: var(--txt-muted); }
    .materia-nota-badge { margin-left: auto; text-align: center; }
    .materia-nota-badge .num { font-size: 1.5rem; font-weight: 800; }
    .materia-nota-badge .lbl { font-size: 10px; color: var(--txt-muted); display: block; }

    .materiales-lista { margin-top: 12px; border-top: 1px solid var(--borde); padding-top: 10px; }
    .material-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--borde);
      font-size: 13px; cursor: pointer; transition: var(--trans);
    }
    .material-item:last-child { border-bottom: none; }
    .material-item:hover { color: var(--verde); padding-left: 4px; }
    .material-ico { font-size: 16px; flex-shrink: 0; }
    .material-nombre { flex: 1; color: var(--txt-secundario); }
    .material-tipo { font-size: 10px; color: var(--txt-muted); }
    .material-fecha { font-size: 10px; color: var(--txt-muted); text-align: right; flex-shrink: 0; }

    .materia-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

    .materia-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .mtab {
      padding: 6px 16px; border-radius: 20px; font-size: 13px;
      font-weight: 400; border: 1px solid var(--borde); background: transparent;
      color: var(--txt-secundario); cursor: pointer; transition: var(--trans);
      font-family: var(--font-ui);
    }
    .mtab.active { background: var(--verde); color: #fff; border-color: var(--verde); font-weight: 500; }
    .mtab:hover:not(.active) { background: var(--verde-suave); border-color: var(--verde-claro); color: var(--verde); }

    .buscador {
      display: flex; gap: 10px; margin-bottom: 1.5rem; align-items: center;
    }
    .buscador input {
      flex: 1; padding: 9px 14px; border: 1.5px solid var(--borde);
      border-radius: var(--radio-md); font-size: 14px; outline: none;
      font-family: var(--font-ui); transition: var(--trans);
    }
    .buscador input:focus { border-color: var(--verde-medio); box-shadow: 0 0 0 3px rgba(45,158,90,0.1); }

    @media (max-width: 960px) { .materia-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 600px) { .materia-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay"></div>

  <main class="app-main">
    <header class="app-topbar">
      <div class="topbar-left">
        <button class="hamburger-btn">☰</button>
        <span class="topbar-title">Mis materias</span>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn">🔔<div class="topbar-notif-dot"></div></button>
        <div class="topbar-avatar" data-user-avatar style="background:#3b6de8;">VG</div>
      </div>
    </header>

    <div class="app-content">

      <!-- Buscador y filtros -->
      <div class="buscador">
        <input type="text" id="buscador" placeholder="🔍  Buscar materia o material..." oninput="filtrar()">
        <div class="stat-card" style="padding: 8px 16px; gap: 8px; border-radius: var(--radio-md);">
          <span style="font-size:12px; color:var(--txt-muted);">Período</span>
          <select style="border:none; background:transparent; font-family:var(--font-ui); font-size:13px; font-weight:600; color:var(--txt-primario); outline:none; cursor:pointer;">
            <option>Período 1</option>
            <option>Período 2</option>
            <option>Período 3</option>
            <option>Período 4</option>
          </select>
        </div>
      </div>

      <div class="materia-tabs">
        <button class="mtab active" onclick="filtrarArea(this,'todas')">Todas (11)</button>
        <button class="mtab" onclick="filtrarArea(this,'ciencias')">Ciencias</button>
        <button class="mtab" onclick="filtrarArea(this,'humanidades')">Humanidades</button>
        <button class="mtab" onclick="filtrarArea(this,'matematicas')">Matemáticas</button>
        <button class="mtab" onclick="filtrarArea(this,'sociales')">Sociales</button>
        <button class="mtab" onclick="filtrarArea(this,'otros')">Otros</button>
      </div>

      <!-- Grid de materias (cargado desde Supabase) -->
      <div class="materia-grid" id="materia-grid"></div><!-- /materia-grid -->
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/sidebar-estudiante.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  const usuario = AUTH.proteger('estudiante');
  if (usuario) AUTH.pintarUsuario(usuario);

  async function cargarMaterias() {
    if (!usuario?.id) return;
    try {
      const client = AUTH.clienteSupabase();
      const { data: est, error: estError } = await client
        .from('estudiantes')
        .select('id, grupo_id, notas(materia_id, periodo, final, materias(nombre))')
        .eq('usuario_id', usuario.id)
        .maybeSingle();
      if (estError || !est) return;

      const { data: asig, error: asigError } = await client
        .from('asignaciones')
        .select('materia_id, materias(nombre)')
        .eq('grupo_id', est.grupo_id);
      if (asigError) return;

      const notas = (est.notas || []).filter(n => n.periodo === 1);
      const notaMap = Object.fromEntries(notas.map(n => [n.materia_id, n.final]));
      const materias = (asig || []).map(a => ({
        nombre: a.materias.nombre,
        nota: notaMap[a.materia_id] || null
      }));

      const colores = ['var(--mat-matematicas)','var(--mat-ciencias)','var(--mat-ingles)','var(--mat-español)','var(--mat-sociales)'];
      const emojis = ['➗','🔬','🌍','📖','🌎'];
      const grid = document.getElementById('materia-grid');
      grid.innerHTML = materias.map((m, i) => `
        <div class="materia-big-card">
          <div class="materia-header-bar" style="background:${colores[i % colores.length]};"></div>
          <div class="materia-card-body">
            <div class="materia-top">
              <div class="materia-emoji">${emojis[i % emojis.length]}</div>
              <div class="materia-info">
                <h4>${m.nombre}</h4>
                <span>Materia asignada</span>
              </div>
              <div class="materia-nota-badge">
                <div class="num" style="color:${colores[i % colores.length]};">${m.nota ? m.nota.toFixed(1) : '—'}</div>
                <span class="lbl">Período 1</span>
              </div>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <span class="badge" style="background:${colores[i % colores.length]}40;">Activa</span>
            </div>
          </div>
        </div>
      `).join('');
    } catch (error) { console.warn('Error cargando materias:', error); }
  }

  function filtrarArea(btn, area) {
    // Placeholder para mantener compatibilidad con filtros
  }

  function filtrar() {
    const q = document.getElementById('buscador').value.toLowerCase();
    document.querySelectorAll('.materia-big-card').forEach(card => {
      card.style.display = card.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  document.addEventListener('DOMContentLoaded', cargarMaterias);
</script>
</body>
</html>
