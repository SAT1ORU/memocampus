<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="MemoCampus, plataforma educativa de IE La Armonía (prototipo).">
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas y Notificaciones — MemoCampus Padre</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .alerta-item {
      display: flex; gap: 14px; padding: 14px 0;
      border-bottom: 1px solid var(--borde); align-items: flex-start;
      transition: var(--trans);
    }
    .alerta-item:last-child { border-bottom: none; }
    .alerta-item.no-leida { background: var(--bg-app); margin: 0 -1.5rem; padding: 14px 1.5rem; border-radius: 0; border-left: 4px solid transparent; }
    .alerta-item.urgente  { border-left-color: var(--error); }
    .alerta-item.media    { border-left-color: var(--alerta); }
    .alerta-item.info     { border-left-color: var(--color-estudiante); }
    .alerta-item.ok       { border-left-color: var(--exito); }

    .alerta-ico-wrap {
      width: 42px; height: 42px; border-radius: var(--radio-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .alerta-titulo { font-size: 14px; font-weight: 600; color: var(--txt-primario); margin-bottom: 3px; }
    .alerta-desc   { font-size: 13px; color: var(--txt-muted); font-weight: 300; line-height: 1.5; }
    .alerta-meta   { font-size: 11px; color: var(--txt-muted); margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
    .alerta-meta span { display: flex; align-items: center; gap: 4px; }

    .alerta-acciones { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }

    .filtro-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .fbtn { padding: 6px 16px; border-radius: var(--radio-full); border: 1px solid var(--borde); background: transparent; font-size: 13px; color: var(--txt-secundario); cursor: pointer; transition: var(--trans); font-family: var(--font-ui); }
    .fbtn.active { background: var(--txt-primario); color: #fff; border-color: var(--txt-primario); }
    .fbtn:hover:not(.active) { background: var(--bg-app); }

    .resumen-banner {
      background: linear-gradient(135deg, #5a1a8a 0%, var(--color-padre) 100%);
      border-radius: var(--radio-xl); padding: 1.5rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap;
    }
    .resumen-banner h2 { color: #fff; font-size: 1.2rem; margin-bottom: 4px; }
    .resumen-banner p  { color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 300; }

    .punto-no-leida {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--error); flex-shrink: 0; margin-top: 5px;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay"></div>

  <main class="app-main">
    <header class="app-topbar">
      <div class="topbar-left">
        <button class="hamburger-btn">☰</button>
        <span class="topbar-title">Alertas y notificaciones</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-sm" onclick="marcarTodasLeidas()">✔ Marcar todas como leídas</button>
        <div class="topbar-avatar" style="background:var(--color-padre); margin-left:8px;">CG</div>
      </div>
    </header>

    <div class="app-content">

      <!-- Resumen -->
      <div class="resumen-banner">
        <div>
          <h2 id="alertas-titulo">Alertas 🔔</h2>
          <p id="alertas-sub">IE La Armonía</p>
        </div>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <div style="text-align:center; background:rgba(255,255,255,0.12); padding:10px 16px; border-radius:var(--radio-md);">
            <div style="color:var(--amarillo); font-size:1.6rem; font-weight:800;">3</div>
            <div style="color:rgba(255,255,255,0.65); font-size:11px;">Tareas urgentes</div>
          </div>
          <div style="text-align:center; background:rgba(255,255,255,0.12); padding:10px 16px; border-radius:var(--radio-md);">
            <div style="color:#fff; font-size:1.6rem; font-weight:800;">2</div>
            <div style="color:rgba(255,255,255,0.65); font-size:11px;">Comunicados nuevos</div>
          </div>
          <div style="text-align:center; background:rgba(255,255,255,0.12); padding:10px 16px; border-radius:var(--radio-md);">
            <div style="color:#fff; font-size:1.6rem; font-weight:800;" id="kpi-inasistencias">0</div>
            <div style="color:rgba(255,255,255,0.65); font-size:11px;">Inasistencias sin justificar</div>
          </div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="filtro-bar">
        <button class="fbtn active" onclick="filtrar(this,'todas')">Todas (7)</button>
        <button class="fbtn" onclick="filtrar(this,'tareas')">⚠️ Tareas</button>
        <button class="fbtn" onclick="filtrar(this,'notas')">📊 Notas</button>
        <button class="fbtn" onclick="filtrar(this,'asistencia')">📅 Asistencia</button>
        <button class="fbtn" onclick="filtrar(this,'comunicados')">📢 Comunicados</button>
      </div>

      <!-- Lista de alertas -->
      <div class="card" style="padding:1.5rem;">

        <div data-alertas-container></div>


      </div><!-- /card -->

    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/sidebar-padre.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/padre-alertas.js"></script>
<script>
  function filtrar(btn, tipo) {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Filtrado por tipo — próxima versión
  }
  function marcarTodasLeidas() {
    alert('Marcadas como leídas');
  }
</script>
<script>
  const usuario = AUTH.proteger('padre');
  if (usuario) { AUTH.pintarUsuario(usuario); cargarAlertasPadre(usuario); }

  async function cargarAlertasPadre(usuario) {
    if (!usuario?.id || !window.supabase || !window.MEMOCAMPUS_CONFIG?.SUPABASE_URL) return;
    try {
      const client = window.supabase.createClient(window.MEMOCAMPUS_CONFIG.SUPABASE_URL, window.MEMOCAMPUS_CONFIG.SUPABASE_ANON_KEY);
      const { data: vinculos, error: vError } = await client.from('padres_estudiantes').select('estudiante_id,estudiantes(nombre,grupos(grado,seccion))').eq('padre_id', usuario.id).limit(1);
      if (vError) throw vError;
      const vinculo = vinculos?.[0];
      if (!vinculo) return;
      const est = vinculo.estudiantes;
      const [alr, asis] = await Promise.all([
        client.from('alertas').select('tipo,detalle,creada_en').eq('estudiante_id', vinculo.estudiante_id).eq('enviada_a_padres', true).order('creada_en', { ascending: false }),
        client.from('asistencia').select('estado').eq('estudiante_id', vinculo.estudiante_id).eq('estado', 'ausente')
      ]);
      if (alr.error) throw alr.error;
      if (asis.error) throw asis.error;

      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
      document.getElementById('alertas-titulo').textContent = `Alertas de ${est.nombre} 🔔`;
      document.getElementById('alertas-sub').textContent = `Grado ${est.grupos.grado}°${est.grupos.seccion} · IE La Armonía`;
      document.getElementById('kpi-inasistencias').textContent = asis.data.length;
      document.getElementById('alertas-reales').innerHTML = (alr.data || []).map(a => {
        const esNota = a.tipo === 'nota_baja';
        return `<div class="alerta-item no-leida ${esNota ? 'urgente' : 'media'}" data-tipo="${esNota ? 'notas' : 'asistencia'}">
          <div class="alerta-ico-wrap" style="background:${esNota ? 'var(--error-suave)' : 'var(--alerta-suave)'};">${esNota ? '📊' : '📅'}</div>
          <div style="flex:1;">
            <div class="alerta-titulo">${esNota ? 'Nota baja' : 'Inasistencias'} — ${esc(est.nombre)}</div>
            <div class="alerta-desc">${esc(a.detalle)}</div>
            <div class="alerta-meta"><span>${new Date(a.creada_en).toLocaleDateString('es-CO')}</span></div>
          </div>
          <div class="alerta-acciones">
            <div class="punto-no-leida"></div>
            <button class="btn btn-ghost btn-sm" onclick="marcarLeida(this)">Entendido</button>
          </div>
        </div>`;
      }).join('');
      document.querySelector('.fbtn').textContent = `Todas (${document.querySelectorAll('.alerta-item').length})`;
    } catch (error) { console.warn('No se pudieron cargar las alertas reales.', error); }
  }

  function filtrar(btn, tipo) {
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.alerta-item').forEach(item => {
      item.style.display = (tipo === 'todas' || item.dataset.tipo === tipo) ? '' : 'none';
    });
  }

  function marcarLeida(btn) {
    const item = btn.closest('.alerta-item');
    item.classList.remove('no-leida', 'urgente', 'media', 'info', 'ok');
    item.style.borderLeftColor = 'transparent';
    item.querySelector('.punto-no-leida')?.remove();
    btn.remove();
  }

  function marcarTodasLeidas() {
    document.querySelectorAll('.punto-no-leida').forEach(p => p.remove());
    document.querySelectorAll('.alerta-item').forEach(item => {
      item.classList.remove('no-leida', 'urgente', 'media', 'info', 'ok');
      item.style.borderLeftColor = 'transparent';
    });
  }
</script>
</body>
</html>
