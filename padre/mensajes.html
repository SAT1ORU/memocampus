<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — MemoCampus Padre</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .chat-layout { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 64px); overflow:hidden; }
    .chat-list { border-right:1px solid var(--borde); overflow-y:auto; background:var(--bg-card); }
    .chat-item { display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid var(--borde); cursor:pointer; transition:var(--trans); align-items:flex-start; }
    .chat-item:hover { background:var(--bg-app); }
    .chat-item.active { background:var(--color-padre-suave); border-left:3px solid var(--color-padre); }
    .chat-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; flex-shrink:0; }
    .chat-item-name { font-size:13px; font-weight:600; color:var(--txt-primario); margin-bottom:2px; }
    .chat-item-preview { font-size:12px; color:var(--txt-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-hora { font-size:10px; color:var(--txt-muted); flex-shrink:0; }

    .chat-window { display:flex; flex-direction:column; height:100%; }
    .chat-header { padding:12px 18px; border-bottom:1px solid var(--borde); display:flex; align-items:center; gap:10px; background:var(--bg-card); }
    .chat-messages { flex:1; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:10px; background:var(--bg-app); }
    .msg { max-width:68%; padding:10px 14px; border-radius:var(--radio-lg); font-size:13.5px; line-height:1.5; }
    .msg-recv { background:var(--bg-card); border:1px solid var(--borde); color:var(--txt-primario); align-self:flex-start; border-radius:4px var(--radio-lg) var(--radio-lg) var(--radio-lg); }
    .msg-sent { background:var(--color-padre); color:#fff; align-self:flex-end; border-radius:var(--radio-lg) 4px var(--radio-lg) var(--radio-lg); }
    .msg-hora { font-size:10px; opacity:0.6; margin-top:4px; }
    .chat-input-area { padding:12px 16px; border-top:1px solid var(--borde); display:flex; gap:10px; background:var(--bg-card); }
    .chat-input-area input { flex:1; padding:10px 14px; border:1.5px solid var(--borde); border-radius:var(--radio-full); font-family:var(--font-ui); font-size:14px; outline:none; transition:var(--trans); }
    .chat-input-area input:focus { border-color:var(--color-padre); }
    .btn-send { width:40px; height:40px; border-radius:50%; background:var(--color-padre); border:none; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--trans); }
    .btn-send:hover { background:var(--verde); transform:scale(1.05); }
    @media(max-width:768px){ .chat-layout { grid-template-columns:1fr; } .chat-list { height:200px; } }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay"></div>

  <main class="app-main" style="overflow:hidden;">
    <header class="app-topbar">
      <div class="topbar-left">
        <button class="hamburger-btn">☰</button>
        <span class="topbar-title">Mensajes a docentes</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar" style="background:var(--color-padre);">CG</div>
      </div>
    </header>

    <div class="chat-layout">
      <div class="chat-list">
        <div style="padding:10px 14px; border-bottom:1px solid var(--borde); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--txt-muted);">Conversaciones</div>

        <div style="padding:12px 14px; border-top:1px solid var(--borde); margin-top:auto;">
          <button class="btn btn-primary" style="width:100%; justify-content:center; font-size:12px;" onclick="nuevoMsg()">+ Nuevo mensaje</button>
        </div>
      </div>

      <div class="chat-window">
        <div class="chat-header">
          <div style="color:var(--txt-muted); padding:1.25rem; text-align:center;">Selecciona un docente para iniciar una conversación</div>
        </div>

        <div class="chat-messages" id="chat-msgs"></div>

        <div class="chat-input-area">
          <input type="text" id="padre-input" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter') enviar()" disabled>
          <button class="btn-send" onclick="enviar()" disabled>➤</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../assets/js/sidebar-padre.js"></script>
<script src="../assets/js/comunicados.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  const usuario = AUTH.proteger('padre');
  if (usuario) AUTH.pintarUsuario(usuario);

  let docenteSeleccionado = null;

  async function cargarDocentes() {
    console.log('cargarDocentes: usuario=', usuario?.id);
    if (!usuario?.id) return;
    try {
      const client = AUTH.clienteSupabase();
      const { data: hijos } = await client
        .from('padres_estudiantes')
        .select('estudiante_id')
        .eq('padre_id', usuario.id);

      console.log('Hijos:', hijos);
      if (!hijos?.length) return;

      const estIds = hijos.map(h => h.estudiante_id);
      const { data: grupos } = await client
        .from('estudiantes')
        .select('grupo_id')
        .in('id', estIds);

      console.log('Grupos:', grupos);
      if (!grupos?.length) return;

      const grupoIds = [...new Set(grupos.map(g => g.grupo_id))];
      const { data: asig } = await client
        .from('asignaciones')
        .select('docente_id, materia_id')
        .in('grupo_id', grupoIds);

      console.log('Asignaciones:', asig);
      if (!asig?.length) return;

      const docIds = [...new Set(asig.map(a => a.docente_id))];
      const { data: docentes, error } = await client
        .from('usuarios')
        .select('id, nombre, correo')
        .in('id', docIds);

      console.log('Docentes:', docentes, 'error:', error);
      renderizarDocentes(docentes || []);
    } catch (e) { console.warn('Error cargando docentes:', e); }
  }

  function renderizarDocentes(docentes) {
    const lista = document.querySelector('.chat-list');
    const titulo = lista.querySelector('div:first-child');
    const btn = lista.querySelector('button');
    lista.innerHTML = '';
    lista.appendChild(titulo);

    docentes.forEach(d => {
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.dataset.docenteId = d.id;
      const initials = d.nombre.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const colores = ['var(--mat-ciencias)', 'var(--mat-matematicas)', 'var(--mat-ingles)', 'var(--mat-sociales)', 'var(--mat-educacion)'];
      const color = colores[d.id % colores.length];
      div.innerHTML = `
        <div class="chat-avatar" style="background:${color};">${initials}</div>
        <div style="flex:1; min-width:0;">
          <div class="chat-item-name">Prof. ${d.nombre.split(' ').pop()}</div>
          <div class="chat-item-preview">${d.correo}</div>
        </div>
      `;
      div.onclick = () => selChat(div, d.id);
      lista.appendChild(div);
    });

    if (btn) lista.appendChild(btn);
  }

  async function selChat(el, docenteId) {
    document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    docenteSeleccionado = docenteId;
    document.getElementById('padre-input').disabled = false;
    document.querySelector('.btn-send').disabled = false;
    await cargarMensajes(docenteId);
  }

  async function cargarMensajes(docenteId) {
    if (!usuario?.id || !docenteId) return;
    try {
      const client = AUTH.clienteSupabase();
      const { data: msgs } = await client
        .from('mensajes')
        .select('*')
        .or(`and(de_usuario_id.eq.${usuario.id},para_usuario_id.eq.${docenteId}),and(de_usuario_id.eq.${docenteId},para_usuario_id.eq.${usuario.id})`)
        .order('creado_en', { ascending: true });

      // Marcar como leído todos los mensajes recibidos de este docente
      if (msgs?.length) {
        const msgIds = msgs.filter(m => m.de_usuario_id === docenteId && !m.leido).map(m => m.id);
        if (msgIds.length > 0) {
          await client.from('mensajes').update({ leido: true }).in('id', msgIds);
          cargarSidebarPadre();
        }
      }

      const { data: docenteData } = await client
        .from('usuarios')
        .select('nombre')
        .eq('id', docenteId)
        .single();

      renderizarMensajes(msgs || [], docenteData?.nombre || 'Docente');
    } catch (e) { console.warn('Error cargando mensajes:', e); }
  }

  function renderizarMensajes(msgs, nombreDocente) {
    const header = document.querySelector('.chat-header');
    const initials = nombreDocente.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    const colores = ['var(--mat-ciencias)', 'var(--mat-matematicas)', 'var(--mat-ingles)', 'var(--mat-sociales)', 'var(--mat-educacion)'];
    const color = colores[docenteSeleccionado % colores.length];
    header.innerHTML = `
      <div class="chat-avatar" style="background:${color}; width:36px; height:36px; font-size:12px;">${initials}</div>
      <div>
        <div style="font-size:14px; font-weight:600; color:var(--txt-primario);">Prof. ${nombreDocente.split(' ').pop()}</div>
        <div style="font-size:12px; color:var(--txt-muted);">Docente</div>
      </div>
    `;

    const msgDiv = document.getElementById('chat-msgs');
    msgDiv.innerHTML = '';
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = m.de_usuario_id === usuario.id ? 'msg msg-sent' : 'msg msg-recv';
      const fecha = new Date(m.creado_en).toLocaleDateString('es-CO');
      const hora = new Date(m.creado_en).toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
      div.innerHTML = `${m.contenido}<div class="msg-hora">${hora} · ${fecha}</div>`;
      msgDiv.appendChild(div);
    });
    msgDiv.scrollTop = msgDiv.scrollHeight;
  }

  async function enviar() {
    const input = document.getElementById('padre-input');
    const text = input.value.trim();
    if (!text || !docenteSeleccionado) return;

    try {
      const client = AUTH.clienteSupabase();
      const { error } = await client.from('mensajes').insert({
        de_usuario_id: usuario.id,
        para_usuario_id: docenteSeleccionado,
        contenido: text
      });
      if (error) { alert('No se pudo enviar: ' + error.message); return; }
      input.value = '';
      await cargarMensajes(docenteSeleccionado);
    } catch (e) { console.error('Error enviando mensaje:', e); }
  }

  function nuevoMsg() {
    alert('Selecciona un docente de la lista para iniciar una nueva conversación.');
  }

  document.addEventListener('DOMContentLoaded', () => cargarDocentes());
</script>
</body>
</html>
