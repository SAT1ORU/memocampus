<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — MemoCampus Docente</title>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <style>
    .chat-layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 64px); overflow:hidden; }
    .chat-list { border-right:1px solid var(--borde); overflow-y:auto; background:var(--bg-card); }
    .chat-item { display:flex; gap:11px; padding:13px 16px; border-bottom:1px solid var(--borde); cursor:pointer; transition:var(--trans); align-items:flex-start; }
    .chat-item:hover { background:var(--bg-app); }
    .chat-item.active { background:var(--color-docente-suave); border-left:3px solid var(--color-docente); }
    .chat-item.unread .chat-item-name { font-weight:700; color:var(--txt-primario); }
    .chat-avatar { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
    .chat-item-name { font-size:13.5px; font-weight:500; color:var(--txt-primario); margin-bottom:2px; }
    .chat-item-preview { font-size:12px; color:var(--txt-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-item-meta { margin-left:auto; text-align:right; flex-shrink:0; }
    .chat-item-hora { font-size:10px; color:var(--txt-muted); }
    .unread-dot { width:8px; height:8px; border-radius:50%; background:var(--color-docente); margin-top:4px; margin-left:auto; }

    .chat-window { display:flex; flex-direction:column; height:100%; }
    .chat-header { padding:14px 20px; border-bottom:1px solid var(--borde); display:flex; align-items:center; gap:12px; background:var(--bg-card); }
    .chat-messages { flex:1; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:10px; background:var(--bg-app); }
    .msg { max-width:68%; padding:10px 14px; border-radius:var(--radio-lg); font-size:13.5px; line-height:1.5; }
    .msg-recibido { background:var(--bg-card); border:1px solid var(--borde); color:var(--txt-primario); align-self:flex-start; border-radius:4px var(--radio-lg) var(--radio-lg) var(--radio-lg); }
    .msg-enviado  { background:var(--color-docente); color:#fff; align-self:flex-end; border-radius:var(--radio-lg) 4px var(--radio-lg) var(--radio-lg); }
    .msg-hora { font-size:10px; opacity:0.6; margin-top:4px; }
    .chat-input-area { padding:12px 16px; border-top:1px solid var(--borde); display:flex; gap:10px; background:var(--bg-card); }
    .chat-input-area input { flex:1; padding:10px 14px; border:1.5px solid var(--borde); border-radius:var(--radio-full); font-family:var(--font-ui); font-size:14px; outline:none; transition:var(--trans); }
    .chat-input-area input:focus { border-color:var(--color-docente); }
    .btn-send { width:40px; height:40px; border-radius:50%; background:var(--color-docente); border:none; color:#fff; font-size:16px; cursor:pointer; transition:var(--trans); display:flex; align-items:center; justify-content:center; }
    .btn-send:hover { background:var(--verde); transform:scale(1.05); }

    @media(max-width:768px){ .chat-layout { grid-template-columns:1fr; } .chat-list { height:220px; } }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay"></div>

  <main class="app-main" style="overflow:hidden;">
    <header class="app-topbar">
      <div class="topbar-left">
        <button class="hamburger-btn">☰</button>
        <span class="topbar-title">Mensajes de padres</span>
      </div>
      <div class="topbar-right">
        <span class="badge badge-naranja">3 sin responder</span>
        <div class="topbar-avatar" data-user-avatar style="background:var(--color-docente); margin-left:8px;">AM</div>
      </div>
    </header>

    <div class="chat-layout">
      <!-- Lista de conversaciones -->
      <div class="chat-list">
        <div style="padding:10px 16px; border-bottom:1px solid var(--borde); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--txt-muted);">Conversaciones</div>
      </div>

      <!-- Ventana de chat -->
      <div class="chat-window">
        <div class="chat-header">
          <div style="color:var(--txt-muted); padding:1.25rem; text-align:center;">Selecciona un padre para ver la conversación</div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Escribe una respuesta..." onkeydown="if(event.key==='Enter') enviarMsg()" disabled>
          <button class="btn-send" onclick="enviarMsg()" disabled>➤</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/sidebar-docente.js"></script>
<script src="../assets/js/auth.js"></script>

<script>
  const usuario = AUTH.proteger('docente');
  if (usuario) AUTH.pintarUsuario(usuario);

  let padreSeleccionado = null;

  async function cargarPadres() {
    console.log('cargarPadres: usuario=', usuario?.id);
    if (!usuario?.id) { console.warn('Sin usuario'); return; }
    try {
      const client = AUTH.clienteSupabase();
      const { data: asig } = await client
        .from('asignaciones')
        .select('grupo_id')
        .eq('docente_id', usuario.id);

      console.log('Asignaciones:', asig);
      if (!asig?.length) { console.warn('Sin asignaciones'); return; }

      const grupoIds = [...new Set(asig.map(a => a.grupo_id))];
      const { data: ests } = await client
        .from('estudiantes')
        .select('id')
        .in('grupo_id', grupoIds);

      console.log('Estudiantes:', ests);
      if (!ests?.length) { console.warn('Sin estudiantes'); return; }

      const estIds = ests.map(e => e.id);
      const { data: padres } = await client
        .from('padres_estudiantes')
        .select('padre_id')
        .in('estudiante_id', estIds);

      console.log('Padres:', padres);
      if (!padres?.length) { console.warn('Sin padres vinculados'); return; }

      const padreIds = [...new Set(padres.map(p => p.padre_id))];
      const { data: usuariosPadres } = await client
        .from('usuarios')
        .select('id, nombre, correo')
        .in('id', padreIds);

      console.log('Usuarios padres:', usuariosPadres);
      renderizarPadres(usuariosPadres || []);
    } catch (e) { console.error('Error cargando padres:', e); }
  }

  function renderizarPadres(padres) {
    const lista = document.querySelector('.chat-list');
    const titulo = lista.querySelector('div:first-child');
    lista.innerHTML = '';
    lista.appendChild(titulo);

    padres.forEach(p => {
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.dataset.padreId = p.id;
      const initials = p.nombre.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
      const colores = ['#9b3de8', '#e87d1e', '#3b6de8', '#1a9b6e', '#d4a574'];
      const color = colores[p.id % colores.length];
      div.innerHTML = `
        <div class="chat-avatar" style="background:${color};">${initials}</div>
        <div style="flex:1; min-width:0;">
          <div class="chat-item-name">${p.nombre}</div>
          <div class="chat-item-preview">${p.correo}</div>
        </div>
      `;
      div.onclick = () => selChat(div, p.id);
      lista.appendChild(div);
    });
  }

  async function selChat(el, padreId) {
    document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    padreSeleccionado = padreId;
    document.getElementById('chat-input').disabled = false;
    document.querySelector('.btn-send').disabled = false;
    await cargarMensajes(padreId);
  }

  async function cargarMensajes(padreId) {
    if (!usuario?.id || !padreId) return;
    try {
      const client = AUTH.clienteSupabase();
      const { data: msgs } = await client
        .from('mensajes')
        .select('*')
        .or(`and(de_usuario_id.eq.${usuario.id},para_usuario_id.eq.${padreId}),and(de_usuario_id.eq.${padreId},para_usuario_id.eq.${usuario.id})`)
        .order('creado_en', { ascending: true });

      // Marcar como leído todos los mensajes recibidos de este padre
      if (msgs?.length) {
        const msgIds = msgs.filter(m => m.de_usuario_id === padreId && !m.leido).map(m => m.id);
        if (msgIds.length > 0) {
          await client.from('mensajes').update({ leido: true }).in('id', msgIds);
          cargarSidebarDocente();
        }
      }

      const { data: padreData } = await client
        .from('usuarios')
        .select('nombre')
        .eq('id', padreId)
        .single();

      renderizarMensajes(msgs || [], padreData?.nombre || 'Usuario');
    } catch (e) { console.warn('Error cargando mensajes:', e); }
  }

  function renderizarMensajes(msgs, nombrePadre) {
    const header = document.querySelector('.chat-header');
    const initials = nombrePadre.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    header.innerHTML = `
      <div class="chat-avatar" style="background:#9b3de8; width:36px; height:36px; font-size:12px;">${initials}</div>
      <div>
        <div style="font-size:14px; font-weight:600; color:var(--txt-primario);">${nombrePadre}</div>
        <div style="font-size:12px; color:var(--txt-muted);">Padre de familia</div>
      </div>
    `;

    const msgDiv = document.getElementById('chat-messages');
    msgDiv.innerHTML = '';
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = m.de_usuario_id === usuario.id ? 'msg msg-enviado' : 'msg msg-recibido';
      const fecha = new Date(m.creado_en).toLocaleTimeString('es-CO', {hour:'2-digit', minute:'2-digit'});
      div.innerHTML = `${m.contenido}<div class="msg-hora">${fecha}</div>`;
      msgDiv.appendChild(div);
    });
    msgDiv.scrollTop = msgDiv.scrollHeight;
  }

  async function enviarMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !padreSeleccionado) return;

    try {
      const client = AUTH.clienteSupabase();
      const { error } = await client.from('mensajes').insert({
        de_usuario_id: usuario.id,
        para_usuario_id: padreSeleccionado,
        contenido: text
      });
      if (error) { alert('No se pudo enviar: ' + error.message); return; }
      input.value = '';
      await cargarMensajes(padreSeleccionado);
    } catch (e) { console.error('Error enviando mensaje:', e); }
  }

  document.addEventListener('DOMContentLoaded', () => cargarPadres());
</script>
</body>
</html>
